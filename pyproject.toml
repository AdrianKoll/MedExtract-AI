[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medextract-ai"
version = "0.1.0"
description = "Aplicação Django para extração estruturada de dados de prescrições"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.0,<6.0",
    "pytesseract>=0.3.13",
    "Pillow>=10.0",
    "faster-whisper>=1.1.0",
    "gunicorn>=22,<24",
    "psycopg[binary]>=3.2,<4.0",
]

[tool.setuptools.packages.find]
include = ["extractor*", "medextract*"]

[tool.django]
settings-module = "medextract.settings"
