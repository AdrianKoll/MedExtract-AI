{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta | MedExtract</title>
  <link rel="stylesheet" href="{% static 'extractor/app.css' %}">
</head>
<body>
  <main class="shell auth-shell">
    <section class="card auth-card">
      <p class="eyebrow">Demonstração</p>
      <h1>Criar conta</h1>
      <p class="subtitle">O cadastro permite salvar um histórico privado de testes.</p>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Criar conta</button>
      </form>
      <p><a href="{% url 'login' %}">Já tenho uma conta</a> · <a href="{% url 'dashboard' %}">Voltar à vitrine</a></p>
    </section>
  </main>
</body>
</html>
